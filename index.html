<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Grimoire des Aventuriers</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#141923;color:#f5e9d2}*{box-sizing:border-box}body{margin:0}header{text-align:center;padding:48px 16px 26px;background:linear-gradient(160deg,#353044,#161b26)}h1{font-family:Georgia,serif;font-size:clamp(2rem,6vw,3.5rem);margin:0}header p{color:#c8c2bb}main{max-width:1100px;margin:auto;padding:26px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.hero{background:#242b37;border:1px solid #5c5346;border-radius:18px;padding:20px;box-shadow:0 8px 30px #0003}.avatar{font-size:3.6rem}.hero h2{font-family:Georgia,serif;font-size:1.7rem;margin:4px 0}.role{color:#c7ac79;margin:0 0 15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#151b26;border-radius:9px;text-align:center;padding:10px 3px}.stat small{display:block;color:#a9b0bb;font-size:.72rem}.stat strong{font-size:1.4rem}.line{margin:12px 0}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#3c4453;padding:5px 9px;border-radius:20px;font-size:.82rem}.muted{color:#b7bac2;font-size:.86rem}.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 24px}.nav a{color:#f5e9d2;background:#394354;padding:10px 15px;border-radius:12px;text-decoration:none;border:1px solid #6d6251}.nav a:hover{background:#56637a}.single{max-width:560px;margin:auto}.single .hero{width:100%}footer{text-align:center;padding:25px;color:#999}#error{color:#ffc0a0;text-align:center}</style></head><body>
<header><h1>⚔️ Le Grimoire des Aventuriers</h1><p>Les héros de notre royaume, leurs exploits et leurs trésors</p></header><main><nav class="nav" aria-label="Choisir une fiche"><a href="./">🏰 Toute la troupe</a><a href="?perso=lou">🦊 Lou</a><a href="?perso=gabin">🔨 Gabin</a><a href="?perso=yaya">🌿 Yaya</a><a href="?perso=ben">⚔️ Ben</a></nav><div id="error" role="alert"></div><div id="heroes" class="grid"><p>Ouverture du grimoire…</p></div></main><footer>Fiches en lecture seule • Mise à jour par le maître du jeu</footer>
<script>
const el=document.querySelector('#heroes');const fmt=v=>v===null||v===undefined?'?':String(v);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function chips(items){return items?.length?items.map(x=>`<span class="chip">${safe(x)}</span>`).join(''):'<span class="muted">À découvrir</span>'}
function render(p){return `<article class="hero"><div class="avatar" aria-hidden="true">${safe(p.emoji)}</div><h2>${safe(p.nom)}</h2><p class="role">${safe(p.role)}</p><div class="line">❤️ <b>Vie :</b> ${fmt(p.pv)} / ${fmt(p.pvMax)} &nbsp; 🪙 <b>Or :</b> ${fmt(p.or)}</div><div class="stats">${[['Corps',p.corps],['Agilité',p.agilite],['Esprit',p.esprit]].map(([k,v])=>`<div class="stat"><small>${k}</small><strong>${fmt(v)}</strong></div>`).join('')}</div><h3>✨ Compétences</h3><div class="chips">${chips(p.competences)}</div><h3>🎒 Équipement</h3><div class="chips">${chips(p.equipement)}</div>${p.familier?`<p>🐾 <b>Familier :</b> ${safe(p.familier)}</p>`:''}${p.orSupplementaire?`<p class="muted">🪙 ${safe(p.orSupplementaire)}</p>`:''}${p.evolutionsEnReserve?`<p>⭐ <b>Évolution en réserve :</b> ${p.evolutionsEnReserve}</p>`:''}${p.equipementEnvisage?.length?`<h3>🛒 Équipement envisagé (non acheté)</h3><div class="chips">${chips(p.equipementEnvisage)}</div>`:''}${p.notes?`<p class="muted">${safe(p.notes)}</p>`:''}</article>`}
fetch('./personnages.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Fichier introuvable');return r.json()}).then(d=>{const id=new URLSearchParams(location.search).get('perso');const selected=id?d.personnages.filter(p=>p.id===id):d.personnages;if(!selected.length){el.innerHTML='<p>Personnage introuvable. Choisis une fiche dans le menu.</p>';return}el.classList.toggle('single',!!id);el.innerHTML=selected.map(render).join('')+`<p class="muted" style="grid-column:1/-1;text-align:center">🏦 Caisse commune : ${fmt(d.caisseCommune)} pièce(s) d’or</p>`;document.title=id?`${selected[0].nom} | Grimoire des Aventuriers`:'Le Grimoire des Aventuriers'}).catch(e=>{el.innerHTML='';document.querySelector('#error').textContent='Impossible de charger les fiches. Vérifie la publication GitHub Pages.'});
</script></body></html>
