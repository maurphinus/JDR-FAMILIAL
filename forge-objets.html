<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge des objets</title><style>body{background:#171a20;color:#eee;font:16px system-ui;max-width:900px;margin:auto;padding:16px}article{border:1px solid #555;border-radius:12px;padding:12px;margin:10px 0}button,input{font:inherit;padding:8px}a{color:#9cf}textarea{width:100%;box-sizing:border-box;min-height:130px}img{max-width:180px;max-height:180px}</style><h1>Forge des objets · V0.1</h1><p>Références visuelles pour les générations IA, sans superposition.</p><a href="./fiche-test.html">Fiche test</a> · <a href="./avatar-factory.html">Avatar Factory</a><div id="list"></div><script>
fetch('./images/objets/catalogue.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{for(const o of d.objects){const a=document.createElement('article'),h=document.createElement('h2');h.textContent=o.label;a.append(h);const p=document.createElement('p');p.textContent=o.hands+' main(s) · '+o.status;a.append(p);if(o.reference){const i=document.createElement('img');i.src='./'+o.reference;a.append(i)}const l=document.createElement('label');l.textContent='Longueur réelle (cm, facultative) ';const n=document.createElement('input');n.type='number';n.min='1';n.value=o.lengthCm||'';l.append(n);a.append(l);const t=document.createElement('textarea');t.readOnly=true;const update=()=>{t.value='Créer une image de référence de cet objet médiéval fantastique : '+o.label+'. Style cartoon 3D cohérent avec les avatars du JDR. Un seul objet entier, isolé, fond neutre uni, sans texte, sans personnage, sans accessoires supplémentaires. Vue trois quarts permettant de distinguer les motifs, la poignée et les proportions. '+(Number(n.value)>0?'Longueur réelle : '+n.value+' cm. ':'')+'Si une image de référence existante est jointe, reproduire fidèlement son design sans le réinventer.'};n.oninput=update;update();const b=document.createElement('button');b.textContent='Copier le prompt';b.onclick=async()=>{try{await navigator.clipboard.writeText(t.value);b.textContent='Copié'}catch{t.focus();t.select()}};a.append(t,b);document.getElementById('list').append(a)}}).catch(()=>document.getElementById('list').textContent='Catalogue inaccessible.');
</script></html>
