<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avatar Factory</title><style>body{font:16px system-ui;background:#171a20;color:#eee;margin:auto;padding:16px;max-width:1000px}label{display:block;margin:8px 0}select,input,button{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}select{width:100%}button{margin:5px}canvas{max-width:100%;height:auto;background:#333}#cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}article{background:#252a32;padding:10px;border-radius:8px}a{color:#9cd4ff}img{max-width:100%}</style><h1>Avatar Factory V0.4</h1><p>Découpe locale et export PNG. Aucun fichier GitHub n'est modifié automatiquement.</p><section style="border:1px solid #777;padding:12px;border-radius:10px"><h2>Préparer une génération</h2><label>Configuration<select id="genconfig"></select></label><div id="genrefs" style="display:flex;flex-wrap:wrap;gap:10px"></div><p id="genstatus"></p><textarea id="genprompt" readonly style="width:100%;min-height:180px;box-sizing:border-box"></textarea><button id="gencopy">Copier le prompt avec références GitHub</button><p><a href="./forge-objets.html">Forge des objets</a></p></section><h2>Découper les images générées</h2><label>Image importée<select id="source"></select></label><label>Ou fichier local <input id="local" type="file" accept="image/*"></label><label>Personnage<select id="person"><option>ben</option><option>gabin</option><option>lou</option><option>yaya</option></select></label><label>État<select id="health"><option>normal</option><option>blesse</option><option>tres_blesse</option></select></label><label>Colonnes <input id="cols" type="number" min="1" max="8" value="1"></label><label>Lignes <input id="rows" type="number" min="1" max="8" value="1"></label><button id="cut">Prévisualiser la découpe</button><p id="status" role="status"></p><canvas id="preview"></canvas><div id="cells"></div><button id="export">Exporter le catalogue JSON</button><p><a href="https://github.com/maurphinus/JDR-FAMILIAL/tree/main/images/avatars/production">Dossiers de production GitHub</a></p><script>
const $=id=>document.getElementById(id), names=["file_000000003508821088f675cf13461fad.png","file_000000004ec48246a36cdeba078e1571.png","file_0000000056f8821095d87b9ff3dc2dd9.png","file_0000000067d0820ab96cfdb3ca4553b8.png","file_000000009be482108514787193444acc.png","file_00000000cf9081f4badb372ec1814f35.png","file_00000000f88481f48c8508cacdb6ed1d.png"], img=new Image();let ready=false,records=[],sourceName='',objectUrl=null;
const configs=['libre-D__libre-G','epee-D__libre-G','libre-D__epee-G','bouclier-D__libre-G','libre-D__bouclier-G','epee-D__bouclier-G','bouclier-D__epee-G','hache-2m','torche-D__libre-G','libre-D__torche-G','torche-D__bouclier-G','bouclier-D__torche-G','torche-D__epee-G','epee-D__torche-G'];
function reset(){ready=false;records=[];$('cells').replaceChildren();$('preview').width=0;$('status').textContent='Chargement…'}
function load(url,name){reset();sourceName=name;img.src=url}
img.onload=()=>{ready=true;cut()};img.onerror=()=>{$('status').textContent='Image inaccessible.'};
for(const n of names){const o=document.createElement('option');o.value=n;o.textContent=n;$('source').append(o)}
$('source').onchange=()=>{if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}load('images/avatars/import/'+encodeURIComponent($('source').value),$('source').value)};
$('local').onchange=()=>{const f=$('local').files[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);load(objectUrl,f.name)};
function grid(){const c=Number($('cols').value),r=Number($('rows').value);return Number.isInteger(c)&&Number.isInteger(r)&&c>=1&&r>=1&&c<=8&&r<=8?[c,r]:null}
function cut(){if(!ready)return;const g=grid();if(!g){$('status').textContent='Grille invalide';return}const [c,r]=g,w=img.naturalWidth,h=img.naturalHeight;if(c>w||r>h)return;records=[];$('cells').replaceChildren();const p=$('preview');p.width=w;p.height=h;const ctx=p.getContext('2d');ctx.drawImage(img,0,0);ctx.strokeStyle='#00ff88';ctx.lineWidth=Math.max(2,w/400);for(let i=1;i<c;i++){ctx.beginPath();ctx.moveTo(w*i/c,0);ctx.lineTo(w*i/c,h);ctx.stroke()}for(let i=1;i<r;i++){ctx.beginPath();ctx.moveTo(0,h*i/r);ctx.lineTo(w,h*i/r);ctx.stroke()}for(let y=0;y<r;y++)for(let x=0;x<c;x++){const x0=Math.round(x*w/c),y0=Math.round(y*h/r),cw=Math.round((x+1)*w/c)-x0,ch=Math.round((y+1)*h/r)-y0;const a=document.createElement('article'),cv=document.createElement('canvas');cv.width=cw;cv.height=ch;cv.getContext('2d').drawImage(img,x0,y0,cw,ch,0,0,cw,ch);const label=document.createElement('p');label.textContent=String.fromCharCode(65+y)+(x+1);const s=document.createElement('select');for(const v of ['',...configs]){const o=document.createElement('option');o.value=v;o.textContent=v||'Choisir configuration';s.append(o)}const b=document.createElement('button');b.textContent='Exporter PNG';const rec={cell:label.textContent,select:s,canvas:cv};records.push(rec);b.onclick=()=>{if(!s.value){alert('Choisis une configuration');return}if(records.filter(q=>q.select.value===s.value).length>1){alert('Configuration en double');return}cv.toBlob(blob=>{if(blob)download(blob,filename(rec))},'image/png')};a.append(label,cv,s,b);$('cells').append(a)}$('status').textContent=w+' × '+h+' pixels · '+records.length+' cases'}
function filename(q){return $('person').value+'_'+$('health').value+'_'+q.select.value+'.png'}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('cut').onclick=cut;$('export').onclick=()=>{if(!records.length||records.some(q=>!q.select.value)||new Set(records.map(q=>q.select.value)).size!==records.length){alert('Attribue une configuration unique à chaque case');return}const data={source:sourceName,personnage:$('person').value,etat:$('health').value,grille:grid(),statut:'a_valider',cases:records.map(q=>({case:q.cell,configuration:q.select.value,fichier:filename(q)}))};download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'catalogue-'+$('person').value+'-'+$('health').value+'.json')};$('cols').onchange=cut;$('rows').onchange=cut;if(names.length)$('source').onchange();
 
const gen=$('genconfig');for(const c of configs){const o=document.createElement('option');o.value=c;o.textContent=c;gen.append(o)}
let objectCatalog=[],genManifest={};
function prepareGeneration(){
 const person=$('person').value,config=gen.value,health=$('health').value,ids=config==='hache-2m'?['hache']:config.split('__').map(x=>x.replace(/-[DG]$/,'')).filter(x=>x!=='libre');
 const refs=$('genrefs');refs.replaceChildren();const missing=[],sources=[];
 function add(label,path){if(!path){missing.push(label);return}sources.push(label+' : https://github.com/maurphinus/JDR-FAMILIAL/blob/main/'+path+'\nImage brute : https://raw.githubusercontent.com/maurphinus/JDR-FAMILIAL/main/'+path);const a=document.createElement('a');a.href='./'+path;a.target='_blank';a.rel='noopener';const img=document.createElement('img');img.src=a.href;img.alt=label;img.style.cssText='height:145px;width:110px;object-fit:contain;display:block';a.append(img,document.createTextNode(label));refs.append(a)}
 const normal=genManifest[person]?.[config],master=genManifest[person]?.['libre-D__libre-G'];
 if(health==='normal'){add('Avatar maître',master?.status==='validated'?master.path:null);for(const id of ids){const o=objectCatalog.find(x=>x.id===id);add(o?.label||id,o?.status==='validated'?o.reference:null)}}else add('Avatar normal de cette configuration',normal?.status==='validated'?normal.path:null);
 $('genstatus').textContent=missing.length?'Références manquantes : '+missing.join(', '):'Références disponibles : ouvre les images et joins-les au générateur.';
 const hands=config==='hache-2m'?'Hache tenue à deux mains.':config.split('__').map((x,i)=>(i?'Main gauche : ':'Main droite : ')+(objectCatalog.find(o=>o.id===x.replace(/-[DG]$/,''))?.label||'libre')).join('. ');
 $('genprompt').value=health==='normal'?'Éditer exclusivement l’avatar maître de '+person+'. '+hands+'. Reproduire fidèlement les objets des images jointes, motifs, couleurs, proportions. Conserver identité, vêtements, accessoires, style et cadrage plein pied. Déplacer les équipements concernés, sans duplication. Ne pas ajouter d’objet non fourni. Une seule image sans texte.':'Éditer exclusivement l’avatar normal joint, sans modifier les équipements, leur position ni le cadrage. État : '+(health==='blesse'?'blessé, égratignures superficielles, bandages visibles, vêtements légèrement abîmés.':'très blessé, bandages plus nombreux, vêtements davantage déchirés, expression fatiguée, sans blessure graphique.')+' Une seule image plein pied.';
 $('genprompt').value+='\n\nSOURCES VISUELLES OBLIGATOIRES — dépôt maurphinus/JDR-FAMILIAL, branche main. Récupérer et examiner les fichiers suivants avant toute génération, puis les transmettre comme références au générateur. Ne pas inventer une référence inaccessible.\n'+sources.join('\n\n')+(missing.length?'\n\nRéférences manquantes : '+missing.join(', ')+'. Ne pas générer avant résolution.':'');
}
gen.onchange=prepareGeneration;$('person').onchange=prepareGeneration;$('health').onchange=prepareGeneration;$('gencopy').onclick=async()=>{try{await navigator.clipboard.writeText($('genprompt').value);$('gencopy').textContent='Copié'}catch{$('genprompt').select()}};
Promise.all([fetch('./images/objets/catalogue.json',{cache:'no-store'}).then(r=>r.json()),fetch('./images/avatars/manifest.json',{cache:'no-store'}).then(r=>r.json())]).then(([c,m])=>{objectCatalog=c.objects;genManifest=m;prepareGeneration()}).catch(()=>{$('genstatus').textContent='Impossible de charger les références.'});
</script></html>
